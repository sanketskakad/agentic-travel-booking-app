services:
  # LLM Mock APIs Sandbox Server (https://github.com/sanketskakad/llm-mock-apis)
  # Provides zero-key mock endpoints for flights, hotels, activities, and bookings with web dashboard
  llm-mock-apis:
    image: sanketkakad/llm-api-playground:latest
    container_name: llm-mock-apis
    ports:
      - "${MOCK_API_PORT:-3000}:3000"
    environment:
      - PORT=3000
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - ../backend/database/db.json:/app/database/db.json
    restart: unless-stopped

  # Multi-Agent Travel Booking Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multi-agents-travel-booking-app
    ports:
      - "8000:8000"
    environment:
      - MOCK_API_BASE_URL=http://llm-mock-apis:3000
      - PORT=8000
    env_file:
      - .env
    depends_on:
      llm-mock-apis:
        condition: service_healthy
    restart: unless-stopped

  # React Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: travel-planner-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://localhost:8000
    depends_on:
      - app
    restart: unless-stopped
